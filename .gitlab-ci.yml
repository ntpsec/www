variables:
  # Registry for the CI image. Forks that build their own image can
  # set IMAGE_REGISTRY to $CI_REGISTRY_IMAGE in CI/CD settings.
  IMAGE_REGISTRY: $CI_REGISTRY/ntpsec/www

pages:
  stage: build
  image: $IMAGE_REGISTRY
  script:
    - python3 ./waf configure --prefix=`pwd`/public/ build install
    - find public -type f -iregex '.*\.\(htm\|html\|txt\|text\|js\|css\)$' -execdir gzip -f --keep {} \;
  artifacts:
    paths:
       - public
  tags:
    - gitlab-org

build_image:
  stage: build
  image: docker
  services:
    - docker:dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE .
    - docker push $CI_REGISTRY_IMAGE
  allow_failure: true
  only:
    - schedules
